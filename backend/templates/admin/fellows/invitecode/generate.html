{% extends "admin/base_site.html" %}
{% block content %}
  <p>Create five single-use invitation codes for a cohort or for fellows who will be assigned later.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
      <input type="submit" value="Generate invitations" class="default">
      <a href="{% url 'admin:fellows_invitecode_changelist' %}" class="closelink">Cancel</a>
    </div>
  </form>
{% endblock %}
