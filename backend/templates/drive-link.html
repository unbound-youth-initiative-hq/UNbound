{% with kind=link.kind %}
<li class="file-item drive-resource">
  <a class="file-info" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
    {% if kind == 'Folder' %}
      <i class="fa-solid fa-folder file-folder" aria-hidden="true"></i>
    {% elif kind == 'File' %}
      <i class="fa-regular fa-file file-doc" aria-hidden="true"></i>
    {% else %}
      <i class="fa-solid fa-link file-generic" aria-hidden="true"></i>
    {% endif %}
    <span class="file-text">
      <span class="file-name">{{ link.title }}</span>
      <span class="file-meta">{{ kind }}</span>
    </span>
    <i class="fa-solid fa-arrow-up-right-from-square drive-open-icon" aria-hidden="true"></i>
  </a>
  {% if link.pinned_by_id == fellow_id %}
    <form method="post" action="{% url 'remove-drive-pin' link.pk %}">
      {% csrf_token %}
      <button class="btn btn-sm btn-ghost" type="submit" aria-label="Unpin {{ link.title }}">Unpin</button>
    </form>
  {% endif %}
</li>
{% endwith %}
