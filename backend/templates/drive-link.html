<li class="file-item drive-resource">
  <a class="file-info" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
    {% include 'resource-card-content.html' with link=link only %}
  </a>
  {% if link.pinned_by_id == fellow_id %}
    <form method="post" action="{% url 'remove-drive-pin' link.pk %}">
      {% csrf_token %}
      <button class="btn btn-sm btn-ghost" type="submit" aria-label="Unpin {{ link.title }}">Unpin</button>
    </form>
  {% endif %}
</li>
